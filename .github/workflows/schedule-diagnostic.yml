name: Schedule diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/schedule-diagnostic.yml
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print trigger and UTC time
        run: |
          echo "Trigger: $GITHUB_EVENT_NAME"
          date -u '+%Y-%m-%dT%H:%M:%SZ'
